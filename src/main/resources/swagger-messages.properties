200=OK with the result
201=OK, the resource has been successfully created
204=OK, without a body
400=Invalid input data (for example, incorrect field type)
401=Authentication error (missing token or digital signature)
403=Insufficient permissions to perform the operation (the user's role does not grant access to this resource)
404=Resource not found
409=Violation of one of the constraints at the database level
412=The data does not match the signature
422=Validation error, the request contains data that does not comply with the rules specified in the domain
500=Internal server error
501=Not implemented (used for stubs)
get-by-id=retrieve a resource by identifier
get-by-id-description=Used to retrieve objects. Does not change the state of the resource
search=retrieve a list of resources
search-description=Used to retrieve objects. Does not change the state of the resource
get-enum-labels=retrieve all translated values
get-enum-labels-description=Used to retrieve objects. Does not change the state of the resource
get-enum-label=retrieve the translated value
get-enum-label-description=Used to retrieve objects. Does not change the state of the resource
post-create=create a resource
post-create-description=Used to create a resource
post-validate=validate a resource
post-validate-description=Used to validate a resource for compliance with the database schema
put=modify a resource
put-description=Used to modify an existing resource with the specified id
put-upsert=modify or create a resource
put-upsert-description=Used to create or modify an existing resource and all nested resources
delete=delete a resource
delete-description=Used to delete a resource with the specified id
